networks:
  shared:
    external: true

services:
  qwen-tts-cpu:
    profiles: ["cpu"]
    build:
      context: .
      target: cpu
    ports:
      - "8000:8000"
    environment:
      DEVICE: cpu
      DTYPE: fp32
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - shared
      - default

  qwen-tts-nvidia:
    profiles: ["nvidia"]
    build:
      context: .
      target: cuda
    ports:
      - "8000:8000"
    environment:
      DEVICE: cuda:0
      DTYPE: fp16
      ATTN_IMPL: sdpa
      WARMUP_CUSTOM_ON_STARTUP: "1"
      WARMUP_TEXT: "Warmup"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      start_period: 5m
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - shared
      - default

  qwen-tts-amd:
    profiles: ["amd"]
    build:
      context: .
      target: rocm
    ports:
      - "8000:8000"
    environment:
      DEVICE: auto
      DTYPE: auto
      SKIP_MODEL_LOAD: ${SKIP_MODEL_LOAD:-0}
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"
      PYTORCH_ROCM_ARCH: "gfx1035"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - shared
      - default
